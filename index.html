<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>/* Nadara QA Field — local, offline implementation of the runtime the app uses (db, user, assets, downloads).
   Everything is stored on this device: documents in IndexedDB "nqa_field/docs", photos in "nqa_field/blobs". */
(function(){
  window.NQA_FIELD=true;window.FIELD_URLS={};
  const DBN='nqa_field';let idb=null;
  const open=()=>idb||(idb=new Promise((res,rej)=>{const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>{r.result.createObjectStore('docs');r.result.createObjectStore('blobs')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(store,mode,fn)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const st=t.objectStore(store);let out;const r=fn(st);if(r)r.onsuccess=()=>{out=r.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error)})};
  const store={};const listeners=new Set();
  let ready=(async()=>{
    try{const d=await open();
      await new Promise(res=>{const t=d.transaction('docs');t.objectStore('docs').openCursor().onsuccess=e=>{const c=e.target.result;if(c){store[c.key]=c.value;c.continue()}else res()}});
      await new Promise(res=>{const t=d.transaction('blobs');t.objectStore('blobs').openCursor().onsuccess=e=>{const c=e.target.result;if(c){try{FIELD_URLS[c.key]=URL.createObjectURL(c.value)}catch(_){}c.continue()}else res()}});
      try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}
    }catch(e){console.warn('Field storage unavailable',e)}
  })();
  const emit=()=>setTimeout(()=>listeners.forEach(f=>{try{f()}catch(e){console.error(e)}}),0);
  const clone=o=>JSON.parse(JSON.stringify(o));
  const merge=(a,b)=>{for(const k in b){const v=b[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))merge(a[k],v);else a[k]=v}return a};
  const persist=(path)=>tx('docs','readwrite',st=>store[path]===undefined?st.delete(path):st.put(store[path],path)).catch(()=>{});
  const snapDoc=p=>({id:p.split('/').pop(),exists:store[p]!==undefined,data:()=>store[p]===undefined?undefined:clone(store[p]),metadata:{fromCache:false,hasPendingWrites:false}});
  function docRef(path){return{path,id:path.split('/').pop(),
    get:async()=>{await ready;return snapDoc(path)},
    set:async d=>{await ready;store[path]=clone(d);await persist(path);emit()},
    update:async d=>{await ready;store[path]=merge(store[path]||{},clone(d));await persist(path);emit()},
    delete:async()=>{await ready;delete store[path];await persist(path);emit()},
    onSnapshot:(n,err)=>{const f=()=>n(snapDoc(path));listeners.add(f);ready.then(f);return()=>listeners.delete(f)},
    collection:p=>colRef(path+'/'+p)}}
  function colRef(path){const depth=path.split('/').length+1;const q={orderBy:()=>q,limit:()=>q,where:()=>q,doc:id=>docRef(path+'/'+(id||Date.now().toString(36))),
    onSnapshot:(n,err)=>{const f=()=>{const docs=Object.keys(store).filter(k=>k.startsWith(path+'/')&&k.split('/').length===depth).map(snapDoc).sort((a,b)=>String(b.data().createdAt||'').localeCompare(String(a.data().createdAt||'')));n({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false},docChanges:()=>[]})};listeners.add(f);ready.then(f);return()=>listeners.delete(f)}};return q}
  const db={doc:docRef,collection:colRef};
  // people & identity kept on the device
  const LS=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};const LSset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  let meId=LS('nqa_me_id');if(!meId){meId='local_'+Math.random().toString(36).slice(2,10);LSset('nqa_me_id',meId)}
  const people=()=>LS('nqa_people')||{};
  const avatar=(name)=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" rx="20" fill="#720062"/><text x="20" y="26" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#fff">${(name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase().replace(/[<&>]/g,'')}</text></svg>`);
  const prof=id=>{const n=id===meId?(LS('nqa_me_name')||''):(people()[id]||'');return{id,name:n,avatarUrl:avatar(n),color:'#720062',email:null,isMe:id===meId,guest:false}};
  const user={me:async()=>({...prof(meId),isOwner:true,canEdit:true}),id:async()=>meId,isOwner:async()=>true,canEdit:async()=>true,can:async()=>true,
    profiles:async ids=>Object.fromEntries((Array.isArray(ids)?ids:[ids]).map(i=>[i,prof(i)])),
    search:async q=>{q=(q||'').trim();const P=people();const all=[prof(meId),...Object.keys(P).map(prof)].filter(p=>p.name);
      const hits=all.filter(p=>!q||p.name.toLowerCase().includes(q.toLowerCase()));
      if(q&&!all.some(p=>p.name.toLowerCase()===q.toLowerCase())){const id='p_'+q.toLowerCase().normalize('NFD').replace(/[^\w]+/g,'_').slice(0,30);P[id]=q;LSset('nqa_people',P);hits.unshift(prof(id))}
      return hits.slice(0,8)}};
  window.NQA_setMyName=n=>{LSset('nqa_me_name',n)};window.NQA_myName=()=>LS('nqa_me_name')||'';window.NQA_people=()=>({...people(),[meId]:LS('nqa_me_name')||''});
  const assets={upload:async(b)=>{const id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);await tx('blobs','readwrite',st=>st.put(b,id));FIELD_URLS[id]=URL.createObjectURL(b);return{id,url:FIELD_URLS[id],sizeBytes:b.size,contentType:b.type}},
    list:async()=>({assets:[],usage:{}}),delete:async id=>{await tx('blobs','readwrite',st=>st.delete(id))},getBlob:async id=>tx('blobs','readonly',st=>st.get(id))};
  window.NQA_getBlob=assets.getBlob;
  const downloads={save:async({filename,data})=>{const blob=data instanceof Blob?data:new Blob([data],{type:/\.json$/.test(filename)?'application/json':/\.html$/.test(filename)?'text/html':'text/csv'});
    const file=new File([blob],filename,{type:blob.type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:filename});return{}}catch(e){if(e&&e.name==='AbortError')throw{code:'cancelled'}}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);return{}}};
  const caps={db,user,assets,downloads};
  window.claude={use:async n=>{await ready;return caps[n]||null}};
  // seed: this device's technician is the validator
  ready.then(()=>{if(!store['config/admins']){store['config/admins']={ids:[meId]};persist('config/admins')}});
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script></head><body>
<title>Nadara QA Field</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@300;400;500;700&display=swap">
<style>
/* Layout: field-kit app — sticky purple top bar, one working column (max 1080px); bottom tab bar on phones, inline tabs on desktop */
:root{
  --nad:#720062; --nad-2:#9b1a85; --nad-soft:#f3e6f0; --on-nad:#ffffff;
  --bg:#f5f3f5; --surface:#ffffff; --surface-2:#faf8fa; --line:#e3dce2; --fg:#1d1620; --muted:#6a5f6c;
  --ok:#1d8a4b; --ok-soft:#e3f4ea; --nok:#c62828; --nok-soft:#fbe7e7; --warn:#b27a00; --warn-soft:#fbf1d9; --na:#7d7480; --na-soft:#eeebee;
  --sev1:#1d8a4b; --sev2:#b27a00; --sev3:#d9590f; --sev4:#c62828;
  --shadow:0 1px 2px rgba(40,10,35,.06),0 6px 20px rgba(40,10,35,.06);
  --f-body:"Roboto",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-head:"Roboto Condensed","Roboto",system-ui,"Arial Narrow",Arial,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px; --bar:#720062;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --nad:#c25bb0; --nad-2:#e07fcf; --nad-soft:#3a2136; --on-nad:#1a0f18;
  --bg:#141015; --surface:#1e181f; --surface-2:#241d25; --line:#372d38; --fg:#efe8ef; --muted:#a79ba9;
  --ok:#4cc27e; --ok-soft:#173326; --nok:#ff6b6b; --nok-soft:#3a1d1f; --warn:#f0b429; --warn-soft:#382d12; --na:#a49aa6; --na-soft:#2c262d;
  --sev1:#4cc27e; --sev2:#f0b429; --sev3:#ff9152; --sev4:#ff6b6b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); --bar:#4e0043; color-scheme:dark}}
:root[data-theme="dark"]{
  --nad:#c25bb0; --nad-2:#e07fcf; --nad-soft:#3a2136; --on-nad:#1a0f18;
  --bg:#141015; --surface:#1e181f; --surface-2:#241d25; --line:#372d38; --fg:#efe8ef; --muted:#a79ba9;
  --ok:#4cc27e; --ok-soft:#173326; --nok:#ff6b6b; --nok-soft:#3a1d1f; --warn:#f0b429; --warn-soft:#382d12; --na:#a49aa6; --na-soft:#2c262d;
  --sev1:#4cc27e; --sev2:#f0b429; --sev3:#ff9152; --sev4:#ff6b6b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); --bar:#4e0043; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:#fff}
:root:not([data-theme="light"]) .top{color:#fff}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;cursor:pointer;background:none;border:0;color:#fff;padding:0}
.brand b{font:700 21px/1 var(--f-head);letter-spacing:-.01em;text-transform:lowercase}
.brand span{font:500 12px/1 var(--f-head);letter-spacing:.12em;text-transform:uppercase;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{background:none;border:0;color:#fff;opacity:.8;padding:8px 12px;border-radius:8px;font:500 14px var(--f-body);cursor:pointer;display:flex;gap:6px;align-items:center}
.tab[aria-current="page"]{opacity:1;background:rgba(255,255,255,.16)}
.tab .badge{background:#fff;color:#720062;border-radius:99px;font:700 11px/1 var(--f-body);padding:3px 6px}
.me{display:flex;align-items:center;gap:8px}
.me img{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.bottomnav{display:none}
main{max-width:1080px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:760px){
  .tabs{display:none}
  .bottomnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bottomnav button{background:none;border:0;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font:500 11px var(--f-body);color:var(--muted);cursor:pointer;position:relative}
  .bottomnav button[aria-current="page"]{color:var(--nad)}
  .bottomnav svg{width:22px;height:22px}
  .bottomnav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--nok);color:#fff;border-radius:99px;font:700 10px/1 var(--f-body);padding:3px 5px}
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .brand span{display:none}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 14px var(--f-body);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--nad)}
.btn.primary{background:var(--nad);border-color:var(--nad);color:var(--on-nad)}
.btn.primary:hover{background:var(--nad-2)}
.btn.danger{color:var(--nok);border-color:var(--nok)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
:focus-visible{outline:3px solid var(--nad-2);outline-offset:2px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.eyebrow{font:500 11px/1.2 var(--f-head);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pagehead{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:28px;line-height:1.1}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px}
.kpi .v{font:700 30px/1 var(--f-head);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font:500 13px var(--f-body);cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--nad-soft);border-color:var(--nad);color:var(--nad)}
.search{flex:1;min-width:160px;height:40px;border:1px solid var(--line);border-radius:999px;padding:0 16px;background:var(--surface)}
.list{display:flex;flex-direction:column;gap:10px}
.acard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;cursor:pointer;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.acard:hover{border-color:var(--nad)}
.acard h3{font-size:18px}
.acard .meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.pbar{height:6px;border-radius:9px;background:var(--na-soft);overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;background:var(--nad)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font:500 12px/1.4 var(--f-body);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.nok{background:var(--nok-soft);color:var(--nok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.na{background:var(--na-soft);color:var(--na)}
.pill.nad{background:var(--nad-soft);color:var(--nad)}
.grade{font:700 13px/1 var(--f-head);width:26px;height:26px;border-radius:7px;display:inline-grid;place-items:center;color:#fff}
.g-A{background:var(--sev1)} .g-B{background:#5aa02c} .g-C{background:var(--sev3)} .g-D{background:var(--sev4)} .g-x{background:var(--na)}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 17px var(--f-head);font-variant-numeric:tabular-nums}
.empty{padding:36px 20px;text-align:center}
.empty h2{font-size:22px;margin-bottom:6px}
.chartwrap{overflow-x:auto}
.chart text{fill:var(--muted);font:11px var(--f-body)}
/* execution */
.exechead{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:10;background:var(--bg);padding-block:10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.secnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.secnav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font:500 12px var(--f-body);cursor:pointer;display:flex;gap:6px;align-items:center;color:var(--fg)}
.secnav button .dot{width:8px;height:8px;border-radius:50%;background:var(--na-soft);border:1px solid var(--line)}
.secnav button.done .dot{background:var(--ok);border-color:var(--ok)} .secnav button.has-nok .dot{background:var(--nok);border-color:var(--nok)}
.section{margin-top:22px;scroll-margin-top:170px}
.section > header{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.section > header h2{font-size:20px}
.section > header .mono{color:var(--nad);font-size:13px}
.item{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;margin-bottom:10px}
.item.s-imp,.item.s-meas{border-left-color:var(--warn)} .item.s-ok{border-left-color:var(--ok)} .item.s-nok{border-left-color:var(--nok)} .item.s-na{border-left-color:var(--na)}
.ihead{display:flex;justify-content:space-between;gap:8px;align-items:center}
.code{font:500 12px var(--f-mono);color:var(--nad)}
.wt{display:flex;gap:3px} .wt i{width:6px;height:6px;border-radius:50%;background:var(--line)} .wt i.on{background:var(--nad)}
.itext{margin:6px 0 4px;font-size:15px}
.hint{font-size:13px;color:var(--muted);margin:0 0 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;max-width:420px}
.seg button{min-height:44px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface-2);font:700 14px var(--f-head);letter-spacing:.04em;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"].ok{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[aria-pressed="true"].nok{background:var(--nok);border-color:var(--nok);color:#fff}
.seg button[aria-pressed="true"].na{background:var(--na);border-color:var(--na);color:#fff}
.meas{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.meas label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.meas input{width:110px;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--surface-2);font-family:var(--f-mono)}
.iact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumb{position:relative;width:76px;height:76px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--na-soft);padding:0;cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:22px;cursor:pointer}
.thumb.loading{display:grid;place-items:center;font-size:11px;color:var(--muted);cursor:default}

/* ---------- scoring ---------- */
const optOf=(it,r)=>{const sc=it.o.sc&&SCALES[it.o.sc];return sc&&r&&r.o?sc.find(o=>o[0]===r.o):null};
function ansVal(it,r){if(!r||!r.s||r.s==='na')return null;const o=optOf(it,r);if(o)return o[2];return r.s==='ok'?1:r.s==='nok'?0:r.s==='imp'?.5:r.s==='meas'?.33:null}
function scoreOf(a){
  const T=tplOf(a),ans=answersOf(a);let num=0,den=0,done=0,nok=0,crit=0,imp=0;const secs={};
  for(const s of T.sections){let sn=0,sd=0,sdone=0,snok=0;
    for(const a2 of s.items){const it=ITEM[a2[0]];const r=ans[it.code];
      if(r&&r.s){sdone++;done++;if(r.s==='imp'||r.s==='meas')imp++}
      const v=ansVal(it,r);if(v==null||it.o.t==='info')continue;
      sd+=it.w;den+=it.w;sn+=it.w*v;num+=it.w*v;
      if(r.s==='nok'){snok++;nok++;if(it.w===3)crit++}}
    secs[s.id]={pct:sd?sn/sd*100:null,done:sdone,count:s.items.length,nok:snok};}
  let pct=den?num/den*100:null;
  if(T.secW){let n=0,d=0;for(const sec of T.sections){const x=secs[sec.id];if(x.pct!=null){n+=T.secW[sec.id]*x.pct;d+=T.secW[sec.id]}}pct=d?n/d:null}
  return {pct,done,total:T.items.length,nok,crit,imp,secs,grade:gradeOf(pct,crit),T};
}
function gradeOf(p,crit){if(p==null)return{g:'x',t:'Not scored'};
  let g=p>=90?'A':p>=75?'B':p>=50?'C':'D';if(crit>0&&(g==='A'||g==='B'))g='C';
  return {g,t:{A:'Fit for extended operation',B:'Fit – minor actions',C:'Conditional – actions required',D:'Not fit – critical findings'}[g]};}
const pctColor=p=>p==null?'var(--na-soft)':p>=90?'var(--sev1)':p>=75?'#5aa02c':p>=50?'var(--sev3)':'var(--sev4)';
function zoneScore(sc,z){let n=0,d=0;for(const sec of sc.T.sections){if(sec.zone!==z)continue;const s=sc.secs[sec.id];if(s.pct!=null){n+=s.pct;d++}}return d?n/d:null}
function ring(p,size=64,stroke=7){const r=(size-stroke)/2,c=2*Math.PI*r,v=p==null?0:p/100;
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--na-soft)" stroke-width="${stroke}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${pctColor(p)}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c*v} ${c}"/></svg>`;}

function actState(x){
  if(!x.evidence||x.status==='open')return {k:'open',t:x.returnNote?'Returned':'Open'};
  const ev=x.evidence.at;let ap=0,rj=0;const per={};

  return {k:'review',t:`Validation ${ap}/${need}`,per};
}

async function flush(){
  if(S.syncing||!S.db)return;const keys=Object.keys(S.queue);if(!keys.length){if(S.offline){S.offline=false;soft()}return}
  S.syncing=true;
  try{for(const k of keys){const q=S.queue[k];if(!q)continue;const t=q.t;let val={...q.val};
      if((val.photos||[]).some(p=>String(p).startsWith('local:'))){if(!S.assets)throw {code:'no_assets'};const out=[];
        for(const p of val.photos){if(!String(p).startsWith('local:')){out.push(p);continue}const b=await LP.get(p);if(!b)continue;
          const r=await withTimeout(S.assets.upload(b,{type:'image/jpeg'}),60000);out.push(r.id);S.localUrls[r.id]=S.localUrls[p];LP.del(p)}
        val={...val,photos:out};if(S.queue[k]&&S.queue[k].t===t){S.queue[k].val=val;Q.save()}}
      const a=S.assess.find(x=>x.id===q.aid);
      await withTimeout(S.db.doc('assessments/'+q.aid).update({answers:{[q.code]:val},updatedAt:new Date().toISOString(),score:a?scoreOf(a).pct:null}),15000);
      if(S.queue[k]&&S.queue[k].t===t){delete S.queue[k];Q.save()}}
    S.offline=false;
  }catch(e){S.offline=true;if(e&&e.code==='invalid_argument'){toast(dbMsg(e))}}
  finally{S.syncing=false;soft()}
  if(Object.keys(S.queue).length)setTimeout(flush,S.offline?20000:500);
}

  if(S.dbErr)return `<div class="notice">The assessment database stopped answering (${esc(S.dbErr)}). Reload the page to reconnect.</div>`;

  if(S.ready&&!S.canWrite)return `<div class="notice">You have view-only access: you can read reports but not record inspections.</div>`;

}

function fleetChart(list){
  if(!list.length)return `<p class="muted" style="margin:10px 0 0">Completed assessments are charted here, one bar per turbine, coloured by grade.</p>`;

  return `<div class="chartwrap"><svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score per turbine">${g}</svg></div>`;
}

     ${syncPill(a.id)}<div class="hide-m"><div class="mono" style="font-size:13px">${sc.done}/${sc.total} answered</div><div class="muted" style="font-size:12px">${sc.nok} nOK · ${pr}%</div></div>
     ${doc?`<button class="btn sm" data-go="doc-${doc.id}">${ICON.doc}SWI</button>`:''}<button class="btn sm" data-go="r-${a.id}">${ICON.chart}<span class="hide-m">Report</span></button></div></div>

  </div>
  ${S.offline&&pendingCount(a.id)?`<div class="notice" style="margin-top:10px">No network. Your answers and photos are kept on this device and upload by themselves when the network is back. Keep this page open (you can lock the phone).</div>`:''}
  ${locked&&a.status==='completed'?`<div class="lockbar">${ICON.check} Completed ${fmtDT(a.completedAt)} by ${esc(nm(a.completedBy))}. Answers are locked.${S.canEdit||S.admins.includes(S.meId)?` <button class="btn sm" data-reopen="${a.id}">Reopen</button>`:''}</div>`:''}
  ${countryCard(a,locked)}
  ${T.sections.map(s=>`<section class="section" id="sec-${s.id}"><header><span class="mono">${s.id}</span><h2>${esc(s.t)}</h2><span class="muted" style="margin-left:auto;font-size:13px">${sc.secs[s.id].done}/${s.items.length}</span></header>

function missingOf(a){const ans=answersOf(a),m=[];if(!a.countryOk)m.push(['Country','not answered']);for(const it of tplOf(a).items){const r=ans[it.code]||{};
  if(!r.s){m.push([it.code,'not answered']);continue}
  const ph=(r.photos||[]).length;if(r.s!=='na'&&(it.o.p==='always'||(it.o.p==='nok'&&r.s==='nok'))&&!ph)m.push([it.code,'photo missing']);
  if(it.o.m&&r.s==='ok'&&it.o.m.max!=null&&!(r.v&&r.v[0]!==''&&r.v[0]!=null))m.push([it.code,'value missing'])}return m}
function finishBox(a,sc){const miss=missingOf(a),open=miss.filter(m=>m[1]==='not answered'),soft2=miss.filter(m=>m[1]!=='not answered');
  const lst=l=>l.slice(0,6).map(m=>`<a href="#a-${a.id}" data-jumpitem="${m[0]}">${m[0]}</a>${m[1]==='not answered'?'':' ('+m[1]+')'}`).join(', ')+(l.length>6?'…':'');
  return `<div class="card finish"><div class="row spread"><div style="min-width:0"><h2 style="font-size:19px">Complete the assessment</h2>
   <p class="muted" style="margin:4px 0 0">${open.length?`${open.length} point${open.length>1?'s':''} not answered yet (use n/a when it doesn't apply to this turbine): ${lst(open)}`:'All control points answered. Completing locks the answers and issues the report.'}</p>
   ${soft2.length?`<p class="need" style="margin:6px 0 0">● ${soft2.length} requested photo${soft2.length>1?'s or values':' or value'} missing: ${lst(soft2)}. You can complete now and add photos later.</p>`:''}</div>
   <button class="btn primary" data-complete="${a.id}" ${open.length?'disabled':''}>${ICON.check}Complete</button></div></div>`}
function itemCard(a,it,r,locked){

async function shrink(file){
  try{const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});const k=Math.min(1,1920/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.86));}catch(e){return file}
}
async function uploadPhotos(files){
  if(!S.assets){toast('Photo upload is not available with your access level.');return []}
  const out=[];for(const f of files){try{const b=await shrink(f);const r=await S.assets.upload(b,{type:b.type&&/^image\/(png|jpeg|gif|webp)$/.test(b.type)?b.type:'image/jpeg'});out.push(r.id)}
    catch(e){toast(e&&e.code==='too_large'?'That photo is too large (max 20 MB).':e&&e.code==='quota_or_state'?'Photo storage is full. Ask an editor to remove unused photos.':'A photo could not be uploaded. Try again.')}}
  return out;
}

  const src=pkg.assessment,nid='f'+String(src.id).replace(/[^\w-]/g,'');
  if(S.assess.some(x=>x.id===nid)){toast('This inspection was already imported.');go('r-'+nid);return}
  if(!S.assets){toast('Photo upload is not available with your access level.');return}
  const ids=Object.keys(pkg.photos||{}),map={};let n=0;
  const tick=()=>{const el=$('#imp-prog');if(el)el.textContent=`Uploading photos ${n}/${ids.length}…`};
  openSheet(`<h2>Importing field inspection</h2><p class="muted">${esc(tplOf(src).name)} · ${esc(src.wtg)} · ${esc(src.wf)}</p><p id="imp-prog" class="mono">Starting…</p>`);
  try{for(const id of ids){const b=await (await fetch(pkg.photos[id])).blob();const r=await S.assets.upload(b,{type:b.type||'image/jpeg'});map[id]=r.id;n++;tick()}
    const mp=l=>(l||[]).map(p=>map[p]).filter(Boolean);
    const answers={};for(const [k,r] of Object.entries(src.answers||{}))answers[k]={...r,photos:mp(r.photos)};
    const {id:_,...rest}=src;
    await S.db.doc('assessments/'+nid).set({...rest,answers,source:'field',fieldNames:pkg.people||{},importedBy:S.meId,importedAt:new Date().toISOString(),updatedAt:new Date().toISOString(),score:scoreOf({...src,answers}).pct});
    for(const x of (pkg.actions||[])){const {id:xid,evidence,...xr}=x;await S.db.doc('actions/f'+String(xid).replace(/[^\w-]/g,'')).set({...xr,aid:nid,findPhotos:[...mp(x.findPhotos),...mp((evidence||{}).photos)],status:'open',desc:(xr.desc?xr.desc+'\n':'')+'Raised in the field app.'})}
    closeSheet();toast('Field inspection imported');go('r-'+nid)}
  catch(e){closeSheet();toast('Import stopped: check the network and try again.')}}

    const css=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n');
    const html=`<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(T.tag+' report – '+a.wtg+' – '+a.wf)}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;700&family=Roboto+Mono:wght@400;500&family=Roboto:wght@300;400;500;700&display=swap"><style>${css}
body{padding:24px 16px} body::before{display:none} .thumb{cursor:default} .gallery .thumb,.thumbs .thumb{width:160px;height:160px} @media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact} body{padding:0} .report{box-shadow:none;border:0}}</style></head><body><main style="max-width:1000px;margin:0 auto;padding:0">${c.outerHTML}<p style="font-size:11px;color:#6a5f6c;margin-top:12px">Exported ${new Date().toLocaleString()} from the Nadara Turbine Assessments app. Open in a browser; print to PDF if needed.</p></main></body></html>`;
    await S.dl.save({filename:`${T.tag}_Report_${(a.wf+'_'+a.wtg).replace(/[^\w-]+/g,'_')}_${a.date}.html`,data:html})}
  catch(e){if(e&&e.code!=='cancelled')toast('The report could not be saved.')}finally{if(btn)btn.disabled=false}}
/* ---------- overlay helpers ---------- */
function openSheet(html){$('#overlay').innerHTML=`<div class="sheet-bg" data-bg><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;const f=$('#overlay').querySelector('input:not([type=file]),button');if(f&&f.tagName==='INPUT')f.focus()}
function closeSheet(){$('#overlay').innerHTML='';if(S.pending){S.pending=false;render()}}
function toast(t){const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function zoom(p){const d=document.createElement('div');d.className='lightbox';d.innerHTML=`<img alt="" src="${blob(p)}"><button aria-label="Close">✕</button>`;d.onclick=()=>d.remove();document.body.appendChild(d)}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,a,[data-zoom]');if(!t)return;const ds=t.dataset;
  if(t.id==='brand')return go('home');
  if(ds.go!=null){e.preventDefault();return go(ds.go)}
  if('new' in ds)return sheetNew();
  if(ds.newtpl)return sheetNew(ds.newtpl);
  if(ds.tfilter){S.tfilter=ds.tfilter;return render()}
  if(ds.pdf)return savePdf(ds.pdf);
  if('close' in ds)return closeSheet();
  if('back' in ds){history.length>1?history.back():go('library');return}
  if(ds.filter){S.filter=ds.filter;return render()}
  if(ds.xfilter){S.xfilter=ds.xfilter;return render()}
  if(ds.zoom){e.preventDefault();return zoom(ds.zoom)}
  if(ds.jump){document.getElementById('sec-'+ds.jump)?.scrollIntoView({behavior:'smooth'});return}
  if(ds.jumpitem){e.preventDefault();document.getElementById('it-'+ds.jumpitem)?.scrollIntoView({behavior:'smooth',block:'center'});return}
  const aid=route().startsWith('a-')?route().slice(2):null;
  if(ds.set&&aid){const it=ITEM[ds.set];const a=S.assess.find(x=>x.id===aid);const r=answersOf(a)[ds.set]||{};
    if(it.o.sc){const o=SCALES[it.o.sc].find(x=>x[0]===ds.s);return saveAns(aid,ds.set,r.o===ds.s?{o:'',s:''}:{o:ds.s,s:o[3]})}
    return saveAns(aid,ds.set,{s:r.s===ds.s?'':ds.s})}
  if(ds.how){S.openHow={...S.openHow,[ds.how]:!S.openHow[ds.how]};return render()}
  if(ds.delref){return saveRefs(ds.delref,(S.refs[ds.delref]||[]).filter(p=>p!==ds.p))}
  if(ds.notebtn){S.openNotes={...(S.openNotes||{}),[ds.notebtn]:1};render();setTimeout(()=>$('#nt-'+ds.notebtn)?.focus(),0);return}
  if(ds.delph&&aid){const a=S.assess.find(x=>x.id===aid);const r=answersOf(a)[ds.delph]||{};return saveAns(aid,ds.delph,{photos:(r.photos||[]).filter(p=>p!==ds.p)})}
  if(ds.mkact&&aid)return sheetMakeAction(aid,ds.mkact);
  if(ds.openact){e.preventDefault();return openAction(ds.openact)}
  if(ds.complete){const a=S.assess.find(x=>x.id===ds.complete);if(missingOf(a).some(m=>m[1]==='not answered'))return;return sheetSign(a)}
  if(ds.reopen){try{await S.db.doc('assessments/'+ds.reopen).update({status:'in_progress'});toast('Assessment reopened')}catch(err){toast(dbMsg(err))}return}
  if(ds.csv)return exportCsv(ds.csv);
  if(ds.export)return exportPackage(ds.export,t);
  if(t.id==='editname')return sheetName();
  if(ds.html)return exportHtml(ds.html,t);
  if(ds.copylink){const u=APP_URL+'#r-'+ds.copylink;try{await navigator.clipboard.writeText(u);toast('Link copied. Only people with access to the app can open it.')}catch(e){openSheet(`<h2>Report link</h2><p class="muted">Copy this link. Only people with access to the app can open it.</p><input class="search" style="width:100%;border-radius:8px" readonly value="${esc(u)}" onfocus="this.select()"><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-close>Close</button></div>`)}return}
  if(t.id==='saveadm'){const ids=[...new Set(pickers['adm'])];if(ids.length<1||ids.length>3){toast('Choose 1 to 3 validators');return}
    try{await S.db.doc('config/admins').set({ids,updatedAt:new Date().toISOString()});S.admDirty=false;toast('Validators saved')}catch(err){toast(dbMsg(err))}return}
  if(ds.editact)return sheetEditAction(ds.editact);
  if(ds.quickact)return quickAct(ds.quickact);
  if(ds.pickphoto){S.pick={kind:'ans',aid:route().slice(2),code:ds.pickphoto};$('#gphoto').click();return}
  if(ds.pickref){S.pick={kind:'ref',code:ds.pickref};$('#gphoto').click();return}
  if(ds.country){const v=$('#cc-'+ds.country).value;try{localStorage.setItem('wtq_country',v)}catch(e){}try{await S.db.doc('assessments/'+ds.country).update({country:v,countryOk:true,updatedAt:new Date().toISOString()});toast('Country confirmed: '+v)}catch(err){toast(dbMsg(err))}return}
  if(ds.reopenact){try{await S.db.doc('actions/'+ds.reopenact).update({status:'open',returnNote:'Reopened by a validator',reopenedBy:S.meId,reopenedAt:new Date().toISOString()});toast('Action reopened');closeSheet()}catch(err){toast(dbMsg(err))}return}
});
document.addEventListener('mousedown',e=>{if(e.target.matches('[data-bg]'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();document.querySelector('.lightbox')?.remove()}});
document.addEventListener('change',e=>{if(e.target.id==='docjump'&&e.target.value){document.getElementById('pg-'+e.target.value)?.scrollIntoView({behavior:'smooth'})}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');if(q){q.focus();q.setSelectionRange(pos,pos)}}});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.id==='impfile'&&el.files&&el.files[0]){const f=el.files[0];el.value='';return importPackage(f)}
  if(el.id&&el.id.startsWith('cc-')){const id=el.id.slice(3),a=S.assess.find(x=>x.id===id);if(a&&a.countryOk){try{await S.db.doc('assessments/'+id).update({country:el.value})}catch(err){toast(dbMsg(err))}}return}
  if(el.id==='gphoto'){const pk=S.pick,fs=[...el.files];el.value='';S.pick=null;if(!pk||!fs.length)return;
    if(pk.kind==='ref'){const code=pk.code,k='ref|'+code;S.uploads[k]=(S.uploads[k]||0)+fs.length;render();const ids=await uploadPhotos(fs);S.uploads[k]-=fs.length;if(ids.length)await saveRefs(code,[...(S.refs[code]||[]),...ids]);else render();return}
    const {aid,code}=pk,k=aid+'|'+code;S.uploads[k]=(S.uploads[k]||0)+fs.length;render();const ids=[];
    for(const f of fs){const b=await shrink(f);const key='local:'+uid();await LP.put(key,b);ids.push(key)}
    S.uploads[k]-=fs.length;const a=S.assess.find(x=>x.id===aid),r=answersOf(a)[code]||{};await saveAns(aid,code,{photos:[...(r.photos||[]),...ids]});return}
  if(el.dataset.ref!=null){const code=el.dataset.ref,fs=[...el.files];el.value='';if(!fs.length)return;const k='ref|'+code;S.uploads[k]=(S.uploads[k]||0)+fs.length;render();
    const ids=await uploadPhotos(fs);S.uploads[k]-=fs.length;if(ids.length)await saveRefs(code,[...(S.refs[code]||[]),...ids]);else render();return}
  const aid=route().startsWith('a-')?route().slice(2):null;if(!aid)return;
  if(el.dataset.note!=null){return saveAns(aid,el.dataset.note,{note:el.value.trim()})}
  if(el.dataset.fld!=null){return saveAns(aid,el.dataset.code,{[el.dataset.fld]:el.value.trim()})}
  if(el.dataset.date!=null){const p={d:el.value};if(el.value&&el.value<today()){p.s='nok';toast('Inspection date expired: marked nOK')}return saveAns(aid,el.dataset.date,p)}
  if(el.dataset.val!=null){const code=el.dataset.val,it=ITEM[code],a=S.assess.find(x=>x.id===aid),r=answersOf(a)[code]||{};
    const v=[...(r.v||[])];v[+el.dataset.i]=el.value.trim().replace(',','.');const patch={v};
    const num=parseFloat(v[0]);if(it.o.m.max!=null&&!isNaN(num))patch.s=num>it.o.m.max?'nok':'ok';
    if(patch.s==='nok')toast(`${num} ${it.o.m.u} is above the ${it.o.m.max} ${it.o.m.u} limit: marked nOK`);
    return saveAns(aid,code,patch)}
  if(el.dataset.photo!=null){const code=el.dataset.photo,fs=[...el.files];el.value='';if(!fs.length)return;const k=aid+'|'+code;
    S.uploads[k]=(S.uploads[k]||0)+fs.length;render();const ids=[];
    for(const f of fs){const b=await shrink(f);const key='local:'+uid();await LP.put(key,b);ids.push(key)}
    S.uploads[k]-=fs.length;const a=S.assess.find(x=>x.id===aid),r=answersOf(a)[code]||{};await saveAns(aid,code,{photos:[...(r.photos||[]),...ids]})}
});
boot();
</script>
